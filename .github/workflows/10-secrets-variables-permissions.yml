
name: Phase 6 - Secrets Variables and Permissions

on:
  push:
    branches:
      - feature/phase6-secrets-permissions
    paths:
      - .github/workflows/10-secrets-variables-permissions.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-configuration:
    name: Validate Secure Configuration
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'practice' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate configuration variables
        shell: bash
        run: |
          echo "Environment: $DEPLOY_ENV"
          echo "Application port: $APP_PORT"

          if ! [[ "$APP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::APP_PORT must be numeric"
            exit 1
          fi

          if (( APP_PORT < 1 || APP_PORT > 65535 )); then
            echo "::error::APP_PORT is outside the valid range"
            exit 1
          fi

          echo "Configuration validation passed"

      - name: Verify demo secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        shell: bash
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "::error::DEMO_SECRET is missing"
            exit 1
          fi

          echo "DEMO_SECRET is configured."
          echo "Secret value has not been displayed."
