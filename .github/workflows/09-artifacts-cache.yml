
name: Phase 5 - Artifacts and Cache

on:
  push:
    branches:
      - 'feature/phase5-artifacts-cache'
    paths:
      - 'phase4-node-app/**'
      - '.github/workflows/09-artifacts-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase4-node-app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-node-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: phase5-build-output
          path: phase4-node-app/dist/
          if-no-files-found: error
          retention-days: 7

  verify-artifact:
    name: Download and Verify Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: phase5-build-output
          path: downloaded-build

      - name: Verify downloaded files
        run: |
          echo "Checking downloaded artifact"
          test -f downloaded-build/app.js
          echo "Artifact verification successful"
          ls -l downloaded-build
