
name: WONBILLS EC2 Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WONBILLS-PROJECT-main/**"
      - ".github/workflows/wonbills-ec2-deploy.yml"

permissions:
  contents: read

concurrency:
  group: wonbills-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          test -n "$EC2_HOST"
          test -n "$EC2_USERNAME"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection successful"'

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          set -eu
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "DEPLOY_TAG='$DEPLOY_TAG' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="$HOME/wonbills-github-actions-practice"
          cd "$APP_DIR"
          git fetch origin main
          git pull --ff-only origin main

          cd "$APP_DIR/WONBILLS-PROJECT-main"
          test -f wonbills-backend/.env
          test -f wonbills-frontend/.env

          BACKEND_IMAGE="wonbills-backend:$DEPLOY_TAG"
          FRONTEND_IMAGE="wonbills-frontend:$DEPLOY_TAG"

          sudo docker build -t "$BACKEND_IMAGE" ./wonbills-backend
          sudo docker build -t "$FRONTEND_IMAGE" ./wonbills-frontend

          sudo docker rm -f wonbills-backend-new wonbills-frontend-new 2>/dev/null || true

          cleanup_candidates() {
            sudo docker rm -f wonbills-backend-new wonbills-frontend-new 2>/dev/null || true
          }
          trap cleanup_candidates EXIT

          sudo docker run -d --name wonbills-backend-new \
            --env-file wonbills-backend/.env \
            -p 18014:8014 "$BACKEND_IMAGE"

          sudo docker run -d --name wonbills-frontend-new \
            --env-file wonbills-frontend/.env \
            -p 15173:5173 "$FRONTEND_IMAGE"

          if ! curl --retry 5 --retry-delay 2 --retry-connrefused \
            -fsS http://127.0.0.1:18014/api/app-version >/dev/null; then
            sudo docker logs wonbills-backend-new || true
            sudo docker logs wonbills-frontend-new || true
            exit 1
          fi

          if ! curl --retry 5 --retry-delay 2 --retry-connrefused \
            -fsS http://127.0.0.1:15173/ >/dev/null; then
            sudo docker logs wonbills-frontend-new || true
            sudo docker logs wonbills-backend-new || true
            exit 1
          fi

          OLD_BACKEND_ID="$(sudo docker inspect -f '{{.Image}}' wonbills-backend)"
          OLD_FRONTEND_ID="$(sudo docker inspect -f '{{.Image}}' wonbills-frontend)"
          sudo docker image tag "$OLD_BACKEND_ID" wonbills-backend:rollback
          sudo docker image tag "$OLD_FRONTEND_ID" wonbills-frontend:rollback

          rollback() {
            echo "Deployment failed; restoring previous images."
            sudo docker rm -f wonbills-frontend wonbills-backend 2>/dev/null || true
            sudo docker run -d --name wonbills-backend --restart unless-stopped \
              --env-file wonbills-backend/.env -p 8014:8014 wonbills-backend:rollback
            sudo docker run -d --name wonbills-frontend --restart unless-stopped \
              --env-file wonbills-frontend/.env -p 5173:5173 wonbills-frontend:rollback
          }

          sudo docker rm -f wonbills-frontend wonbills-backend

          if ! sudo docker run -d --name wonbills-backend --restart unless-stopped \
            --env-file wonbills-backend/.env -p 8014:8014 "$BACKEND_IMAGE"; then
            rollback
            exit 1
          fi

          if ! sudo docker run -d --name wonbills-frontend --restart unless-stopped \
            --env-file wonbills-frontend/.env -p 5173:5173 "$FRONTEND_IMAGE"; then
            rollback
            exit 1
          fi

          if ! curl --retry 5 --retry-delay 2 --retry-connrefused \
            -fsS http://127.0.0.1:8014/api/app-version >/dev/null; then
            sudo docker logs wonbills-backend || true
            rollback
            exit 1
          fi

          if ! curl --retry 5 --retry-delay 2 --retry-connrefused \
            -fsS http://127.0.0.1:5173/ >/dev/null; then
            sudo docker logs wonbills-frontend || true
            rollback
            exit 1
          fi

          sudo docker ps --filter name=wonbills-backend --filter name=wonbills-frontend
          REMOTE

